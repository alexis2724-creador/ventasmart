<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VentaSmart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo">
                <h2><i class="fas fa-chart-line"></i> VentaSmart</h2>
            </div>
            <nav class="menu">
                <a href="{{ url_for('index') }}"><i class="fas fa-home"></i> inicio</a>
                <a href="{{ url_for('inventario') }}"><i class="fas fa-box"></i> Inventario</a>
                <a href="{{ url_for('ventas') }}"><i class="fas fa-shopping-cart"></i> Ventas</a>
                <a href="{{ url_for('reportes') }}"><i class="fas fa-chart-pie"></i> Estadísticas</a>
            </nav>
        </aside>

        <main class="content">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
